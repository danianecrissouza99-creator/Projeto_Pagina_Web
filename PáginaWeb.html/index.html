<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDCEI - Simulador Epidémico</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <h1>MEDCEI</h1>
                <span>SAÚDE SIMPLIFICADA</span>
            </div>
            <p>Simulador de Propagação Epidémica Interativo</p>
        </header>

        <div class="main-content">
            <aside class="controls">
                <h2>Configurações</h2>
                
                <div class="field">
                    <label>População Total</label>
                    <input type="number" id="popInput" value="1000">
                </div>

                <div class="field">
                    <label>Taxa de Transmissão (β): <span id="betaVal">0.3</span></label>
                    <input type="range" id="betaInput" min="0.01" max="1" step="0.01" value="0.3" class="slider-green">
                </div>

                <div class="field">
                    <label>Taxa de Recuperação (γ): <span id="gammaVal">0.1</span></label>
                    <input type="range" id="gammaInput" min="0.01" max="0.5" step="0.01" value="0.1" class="slider-yellow">
                </div>

                <button id="runBtn">SIMULAR AGORA</button>
            </aside>

            <section class="chart-area">
                <canvas id="sirChart"></canvas>
            </section>
        </div>
        <footer>
            <p>MEDCEI © 2025 - A Sua Saúde, A Nossa Prioridade!</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
